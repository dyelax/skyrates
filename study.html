<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#111d21" />
    <title>The Wayfarer · Skyrates Model Study</title>
    <link rel="icon" href="./compass.svg" />
  </head>
  <body>
    <main class="study">
      <div class="model-stage" id="stage">
        <canvas
          tabindex="0"
          aria-label="The Wayfarer, an orbitable three-dimensional airship. Use arrow keys to rotate, plus and minus to zoom, and Home to reset."
        ></canvas
        ><img
          class="source"
          src="./study/wayfarer-elevation.webp"
          alt="The Wayfarer in profile, with ivory solar sails, gilded stern windows and a green lift keel."
          hidden
        />
      </div>
      <header>
        <p>Skyrates<span> / </span>Model study</p>
        <h1>The Wayfarer</h1>
      </header>
      <a class="return" href="./">← <span>Harbor</span></a>
      <div class="status" role="status">Preparing the ship…</div>
      <footer>
        <div class="legend">
          <p class="spec"></p>
          <p class="input-hint">Drag to orbit · Scroll or pinch to zoom</p>
        </div>
        <div class="tools" aria-label="Model controls">
          <button id="spin" type="button" aria-pressed="false">Turntable</button
          ><button id="reset" type="button">Reset view</button
          ><button id="compare" type="button" aria-pressed="false">Painting</button>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/study/study.ts"></script>
  </body>
</html>
